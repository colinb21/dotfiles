general {
    lock_cmd = pidof hyprlock || hyprlock    # don't stack multiple hyprlocks
    before_sleep_cmd = loginctl lock-session # lock before suspend, so resume shows hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 min idle: lock the screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min idle: screen off (no auto-suspend — this is a desktop that may
# be running downloads/Steam; suspend manually with SUPER+SHIFT+ESCAPE)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
