# ------------------------------------------------------------------
# Monitors — adjust to your setup. `preferred` picks native resolution.
# ------------------------------------------------------------------
monitor = , preferred, auto, 1

# ------------------------------------------------------------------
# Autostart
# ------------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ------------------------------------------------------------------
# Environment (Wayland-native hints)
# ------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

# ------------------------------------------------------------------
# Input
# ------------------------------------------------------------------
input {
    kb_layout = us
    kb_options = ctrl:nocaps    # capslock is another Ctrl, no capslock function
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# ------------------------------------------------------------------
# General appearance
# ------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
}

misc {
    # No built-in default wallpapers (the anime ones) — plain background
    # until hyprpaper is configured with a real image.
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ------------------------------------------------------------------
# Keybinds — SUPER is the mod key (Windows/Meta)
# ------------------------------------------------------------------
$mod = SUPER
$term = ghostty
$launcher = fuzzel
$browser = firefox
$files = nautilus

# App launches
bind = $mod, RETURN, exec, $term
bind = $mod, D, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files

# Window management
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exit    # quit hyprland

# Focus movement (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move active window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Screenshots (grimblast wraps grim+slurp)
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copysave area ~/Pictures/Screenshots/$(date +%F-%H%M%S).png

# Clipboard history via fuzzel
bind = $mod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Lock screen
bind = $mod, ESCAPE, exec, hyprlock

# Media keys
bindl = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindl = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute,        exec, pamixer -t
bindl = , XF86AudioPlay,        exec, playerctl play-pause
bindl = , XF86AudioNext,        exec, playerctl next
bindl = , XF86AudioPrev,        exec, playerctl previous
bindl = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Mouse: SUPER-drag to move/resize floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
