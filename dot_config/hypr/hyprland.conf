# ------------------------------------------------------------------
# Monitors — adjust to your setup. `preferred` picks native resolution.
# ------------------------------------------------------------------
monitor = , preferred, auto, 1

# ------------------------------------------------------------------
# Autostart
# ------------------------------------------------------------------
# Shell layer (waybar/mako/hyprpaper vs noctalia) is chosen at the
# greeter; hypr-shell-start reads ~/.local/state/hypr-shell and starts
# the right set. hypridle runs in both variants.
exec-once = ~/.local/bin/hypr-shell-start
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ------------------------------------------------------------------
# Environment (Wayland-native hints)
# ------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

# ------------------------------------------------------------------
# Input
# ------------------------------------------------------------------
input {
    kb_layout = us
    kb_options = ctrl:nocaps    # capslock is another Ctrl, no capslock function
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# ------------------------------------------------------------------
# General appearance
# ------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
}

misc {
    # No built-in default wallpapers (the anime ones) — plain background
    # until hyprpaper is configured with a real image.
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ------------------------------------------------------------------
# Keybinds — SUPER is the mod key (Windows/Meta)
# ------------------------------------------------------------------
$mod = SUPER
$term = ghostty
$launcher = fuzzel
$browser = firefox
$files = nautilus

# App launches (bindd = bind with description, shown by SUPER+/ popup)
bindd = $mod, RETURN, Open terminal, exec, $term
bindd = $mod, D, App launcher, exec, $launcher
bindd = $mod, B, Web browser, exec, $browser
bindd = $mod, E, File manager, exec, $files

# Window management
bindd = $mod, Q, Close window, killactive
bindd = $mod, F, Toggle fullscreen, fullscreen
bindd = $mod, V, Toggle floating, togglefloating
bindd = $mod SHIFT, E, Quit Hyprland, exit

# Focus movement (vim keys)
bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, L, Focus right, movefocus, r

# Move windows
bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, J, Move window down, movewindow, d
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, L, Move window right, movewindow, r

# Workspaces 1-9
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9

# Move active window to workspace
bindd = $mod SHIFT, 1, Send window to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Send window to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Send window to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Send window to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Send window to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Send window to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Send window to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Send window to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Send window to workspace 9, movetoworkspace, 9

# Screenshots (grimblast wraps grim+slurp)
bindd = , Print, Screenshot area to clipboard, exec, grimblast copy area
bindd = SHIFT, Print, Screenshot area to file, exec, grimblast copysave area ~/Pictures/Screenshots/$(date +%F-%H%M%S).png

# Clipboard history via fuzzel
bindd = $mod, C, Clipboard history, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Lock screen / suspend
bindd = $mod, ESCAPE, Lock screen, exec, hyprlock
bindd = $mod SHIFT, ESCAPE, Suspend, exec, systemctl suspend

# Keybinding help popup
bindd = $mod, slash, Show this keybinding list, exec, ~/.local/bin/hypr-binds

# Media keys (bindld = locked + description: works even on the lock screen)
bindld = , XF86AudioRaiseVolume, Volume up, exec, pamixer -i 5
bindld = , XF86AudioLowerVolume, Volume down, exec, pamixer -d 5
bindld = , XF86AudioMute,        Toggle mute, exec, pamixer -t
bindld = , XF86AudioPlay,        Play/pause, exec, playerctl play-pause
bindld = , XF86AudioNext,        Next track, exec, playerctl next
bindld = , XF86AudioPrev,        Previous track, exec, playerctl previous
bindld = , XF86MonBrightnessUp,   Brightness up, exec, brightnessctl set +5%
bindld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-

# Mouse: SUPER-drag to move/resize floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
