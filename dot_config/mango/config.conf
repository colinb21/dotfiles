# MangoWM config — nixbox
# See https://github.com/mangowm/mango/wiki/

# Autostart
exec-once=mangobar
exec-once=mako
exec-once=~/.local/bin/mango-wallpaper

# Window effects
blur=0
shadows=0
border_radius=8
no_border_when_single=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_open=350
animation_duration_close=350
animation_duration_move=350
animation_duration_tag=300
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# Layout
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
tag_num=9
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Gaps and borders
gappih=6
gappiv=6
gappoh=10
gappov=10
borderpx=2
focuscolor=0xa9aefeff
bordercolor=0x444444ff
rootcolor=0x070722ff

# Keyboard
repeat_rate=25
repeat_delay=300
xkb_rules_layout=us
xkb_rules_options=ctrl:nocaps

# Mouse
sloppyfocus=1
warpcursor=1
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Misc
focus_on_activate=1
cursor_size=24
drag_tile_to_tile=1

# ── Keybindings ──────────────────────────────────────────────────────────────
# Terminal and launcher (matching Hyprland layout)
bind=SUPER,Return,spawn,ghostty
bind=SUPER,d,spawn,fuzzel
bind=SUPER,b,spawn,firefox
bind=SUPER,e,spawn,nautilus

# Reload config
bind=SUPER,r,reload_config

# Window management
bind=ALT,q,killclient
bind=ALT,backslash,togglefloating
bind=ALT,f,togglefullscreen
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized

# Focus (vi-style + arrows)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next

# Swap windows
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# Tags (workspaces) — Ctrl+number to switch, Alt+number to move window
bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# Tag navigation
bind=SUPER,comma,viewtoleft,0
bind=SUPER,period,viewtoright,0

# Resize
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50

# Audio (matching Hyprland config)
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer -i 5
bind=NONE,XF86AudioLowerVolume,spawn,pamixer -d 5
bind=NONE,XF86AudioMute,spawn,pamixer -t
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Screenshot
bind=NONE,Print,spawn,grimblast copy area

# Lock
bind=SUPER,Escape,spawn,hyprlock

# Quit compositor
bind=SUPER+SHIFT,Escape,quit
